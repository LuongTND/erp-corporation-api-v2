name: Deploy to MonsterASP
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ========== JOB 1: BUILD ==========
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/API/API.csproj --configuration Release --output ./publish --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-files
          path: ./publish

  # ========== JOB 2: DEPLOY ==========
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-files
          path: ./publish

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Test FTP Connection
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:passive-mode true;
            set ssl:verify-certificate false;
            open -u $FTP_USERNAME,$FTP_PASSWORD ftp://$FTP_HOST;
            ls /wwwroot/;
            quit
          "

      - name: Upload app_offline.htm
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Site is being updated..." > app_offline.htm
          lftp -e "
            set ftp:passive-mode true;
            set ssl:verify-certificate false;
            open -u $FTP_USERNAME,$FTP_PASSWORD ftp://$FTP_HOST;
            put app_offline.htm -o /wwwroot/app_offline.htm;
            quit
          "

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:passive-mode true;
            set ssl:verify-certificate false;
            open -u $FTP_USERNAME,$FTP_PASSWORD ftp://$FTP_HOST;
            mirror -R --delete --exclude app_offline.htm ./publish/ /wwwroot/;
            quit
          "

      - name: Remove app_offline.htm
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:passive-mode true;
            set ssl:verify-certificate false;
            open -u $FTP_USERNAME,$FTP_PASSWORD ftp://$FTP_HOST;
            rm -f /wwwroot/app_offline.htm;
            quit
          "
